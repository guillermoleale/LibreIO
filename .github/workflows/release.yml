# SPDX-License-Identifier: GPL-3.0-or-later
# Construye los instaladores de escritorio en las tres plataformas y los publica en GitHub Releases
# al crear un tag vX.Y.Z. Con workflow_dispatch solo construye, sin publicar.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    name: Escritorio ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/ui/src-tauri
      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Build y publicación con Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/ui
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "LibreIO ${{ github.ref_name }}"
          releaseBody: |
            Instaladores de LibreIO para Windows, macOS y Linux. La versión web, sin instalar nada, está en https://guillermoleale.com/LibreIO/

            Los instaladores no están firmados con certificado de Microsoft ni de Apple, así que el sistema muestra un aviso la primera vez. Es un paso único y no significa que la app esté rota.

            **Windows 10 o superior.** `LibreIO_*_x64-setup.exe` (instalador), `LibreIO_*_x64_en-US.msi` o `LibreIO_*_portable_x64.exe` (corre sin instalar). Si SmartScreen muestra "Windows protegió tu PC", elegir "Más información" y "Ejecutar de todas formas".

            **macOS 12 o superior.** `LibreIO_*_aarch64.dmg` para Mac con chip Apple y `LibreIO_*_x64.dmg` para Mac con Intel. Arrastrar LibreIO a Aplicaciones. Al abrirla por primera vez aparece un aviso de que Apple no puede verificar la app: cerrarlo, abrir Ajustes del Sistema, Privacidad y seguridad, bajar hasta el mensaje sobre LibreIO y elegir "Abrir de todas formas". Si el aviso dice que LibreIO "está dañado", ejecutar en Terminal `xattr -cr /Applications/LibreIO.app` y abrirla de nuevo.

            **Ubuntu 22.04 o superior.** `LibreIO_*_amd64.deb` (`sudo apt install ./LibreIO_*_amd64.deb`) o `LibreIO_*_amd64.AppImage` (darle permiso de ejecución y ejecutarlo).

            Instrucciones completas en https://github.com/guillermoleale/LibreIO#instalar
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Verificar la firma ad hoc del bundle de macOS
        if: startsWith(matrix.platform, 'macos')
        # El bundler borra la carpeta .app después de armar el dmg, así que se monta el dmg y se revisa la app adentro
        run: |
          shopt -s nullglob
          DMGS=(apps/ui/src-tauri/target/*/release/bundle/dmg/*.dmg)
          [ ${#DMGS[@]} -gt 0 ] || { echo "no se encontró el dmg"; exit 1; }
          for DMG in "${DMGS[@]}"; do
            echo "== $DMG"
            MOUNT=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" >/dev/null
            APP=("$MOUNT"/*.app)
            codesign -dv --verbose=2 "${APP[0]}" 2>&1 | tee /tmp/codesign.txt
            if ! grep -q "Signature=adhoc" /tmp/codesign.txt; then
              echo "el bundle no quedó firmado ad hoc"
              hdiutil detach "$MOUNT" >/dev/null
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "${APP[0]}"
            test -f "${APP[0]}/Contents/_CodeSignature/CodeResources"
            hdiutil detach "$MOUNT" >/dev/null
          done
      - name: Publicar ejecutable portable de Windows
        if: matrix.platform == 'windows-latest' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Copy-Item apps/ui/src-tauri/target/release/libreio.exe "LibreIO_${version}_portable_x64.exe"
          gh release upload "${{ github.ref_name }}" "LibreIO_${version}_portable_x64.exe" --clobber
